# Sitio público (por defecto)
server {
    listen 80;
    server_name empresa.local;
    root /usr/share/nginx/html;
    index index.html;
}

# Sitio oculto (VHost secreto realista)
server {
    listen 80;
    server_name staging.empresa.local;
    root /usr/share/nginx/secret;
    index index.html;
}
